name: Deploy to GitHub Pages

on:
  # Merging a PR into main pushes to main, which builds and deploys the site.
  push:
    branches: [main]
  # PRs into main build the site to prove it works, but never deploy.
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab for manual redeploys.
  workflow_dispatch:

# Least privilege: read the code, write to Pages, and request an OIDC token
# that proves to Pages this deployment came from this repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Don't cancel a deployment in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
